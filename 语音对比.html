var META = {"きょうしつ": ["audio_jp/7e12821a5ba3.mp3", "audio_jp_neural/7e12821a5ba3.mp3"], "びょういん": ["audio_jp/0cad0571d44b.mp3", "audio_jp_neural/0cad0571d44b.mp3"], "いもうと": ["audio_jp/3f5b4e6556fa.mp3", "audio_jp_neural/3f5b4e6556fa.mp3"], "そふ": ["audio_jp/95206a00f9d1.mp3", "audio_jp_neural/95206a00f9d1.mp3"], "ちゅうかりょうり": ["audio_jp/0fc5340250d8.mp3", "audio_jp_neural/0fc5340250d8.mp3"], "タオル": ["audio_jp/ab3ea82f2cad.mp3", "audio_jp_neural/ab3ea82f2cad.mp3"], "ぶじゅつ": ["audio_jp/a8af993f4603.mp3", "audio_jp_neural/a8af993f4603.mp3"], "せいと": ["audio_jp/fb40637776d9.mp3", "audio_jp_neural/fb40637776d9.mp3"], "むすめ": ["audio_jp/26554faeec82.mp3", "audio_jp_neural/26554faeec82.mp3"], "にほんご": ["audio_jp/f31040750b56.mp3", "audio_jp_neural/f31040750b56.mp3"], "ちず": ["audio_jp/a12b39180817.mp3", "audio_jp_neural/a12b39180817.mp3"], "めがね": ["audio_jp/525401495012.mp3", "audio_jp_neural/525401495012.mp3"], "が": ["", "audio_jp_neural/a142816563b3.mp3"], "ぱ": ["", "audio_jp_neural/81223f8ee527.mp3"], "司会は 田中さんですか。": ["", "audio_jp_neural/60b4c5a6de0e.mp3"], "きって": ["", "audio_jp_neural/e72b7d7266eb.mp3"]};
var ctx = null, cache = {};
function ac(){ if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ctx&&ctx.state==='suspended')ctx.resume(); return ctx; }
function play(url){
  var c = ac(); if(!c) return;
  if (cache[url]) { var s=c.createBufferSource(); s.buffer=cache[url]; s.connect(c.destination); s.start(0); return; }
  fetch(url).then(function(r){return r.arrayBuffer();})
    .then(function(ab){ return new Promise(function(res,rej){ c.decodeAudioData(ab,res,rej); }); })
    .then(function(b){ cache[url]=b; play(url); }).catch(function(){});
}
function say(t){
  try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t); u.lang='ja-JP'; speechSynthesis.speak(u); }catch(e){}
}
document.querySelectorAll('.row').forEach(function(r){
  var k = r.getAttribute('data-k'), m = META[k];
  r.querySelector('.sys').onclick = function(){ say(k); };
  r.querySelector('.neu').onclick = function(){ if(m[1]) play(m[1]); };
  r.querySelector('.hum').onclick = function(){ if(m[0]) play(m[0]); };
  r.querySelectorAll('button.p').forEach(function(b){ b.addEventListener('click', function(){
    r.querySelectorAll('button.p').forEach(function(x){x.classList.remove('on');}); b.classList.add('on');
  }); });
});
