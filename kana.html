<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f6f0e4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1522" media="(prefers-color-scheme: dark)">
<title>五十音図 · 点读</title>
<link rel="stylesheet" href="skin.css?v=4">
<script src="icons.js?v=1"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0 0 calc(40px + env(safe-area-inset-bottom));font:16px/1.5 var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.page{max-width:760px;margin:0 auto;padding:0 14px}
.banner{height:176px;color:#fff}
.banner::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(10,14,30,.3),rgba(10,14,30,0) 70%)}
.banner .in{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 0;display:flex;align-items:flex-start;gap:10px}
.home{flex:0 0 auto;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;text-decoration:none;color:#fff;
  font:700 19px/1 var(--serif);background:rgba(14,18,34,.3);border:1px solid rgba(255,255,255,.3)}
.banner h1{margin:0;font:700 19px/1.2 var(--serif);letter-spacing:3px;text-shadow:0 1px 10px rgba(0,0,0,.3)}
.banner .sub{font-size:11.5px;opacity:.92;margin-top:4px;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.top{position:sticky;top:0;z-index:30;margin:-18px 0 12px;padding:0 14px}
.seg{max-width:760px;margin:0 auto;display:flex;gap:3px;padding:4px;border-radius:16px;background:rgba(255,251,244,.95);border:1px solid var(--line);
  box-shadow:0 10px 26px rgba(80,52,22,.14);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.seg button{flex:1;border:0;border-radius:12px;padding:9px 2px;color:var(--ink2);background:transparent;font:700 13px/1 var(--sans);white-space:nowrap}
.seg button.on{background:var(--accBg);color:#fff;box-shadow:0 6px 16px rgba(31,58,96,.28)}
.bar{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}
.tg{border-radius:10px;padding:8px 12px;font:650 12.5px/1 var(--sans);color:var(--ink2);border:1px solid var(--line);background:var(--card2)}
.tg.on{background:var(--ai);color:#fff;border-color:transparent}
.tg.soft.on{background:var(--aiSoft);color:var(--ai);border-color:rgba(31,59,99,.25)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:12px}
.head{display:grid;gap:6px;margin-bottom:6px;font-size:11px;font-weight:700;color:var(--ink3);text-align:center;letter-spacing:1px}
.grid{display:grid;gap:6px}
.c5{grid-template-columns:repeat(5,1fr)}
.c3{grid-template-columns:repeat(3,1fr)}
.cell{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--solid);padding:8px 2px 6px;text-align:center;
  transition:transform .16s var(--ease),border-color .2s,background .2s;min-height:62px}
.cell:active{transform:scale(.94)}
.cell .k{font:700 26px/1.15 var(--serif);color:var(--ink)}
.c3 .cell .k{font-size:23px}
.cell .r{font-size:11px;color:var(--ink3);margin-top:2px;letter-spacing:.5px}
.cell .o{position:absolute;top:3px;right:5px;font:600 9.5px/1 var(--serif);color:var(--ink3)}
.cell.empty{background:transparent;border-style:dashed;opacity:.35;pointer-events:none}
.cell.speaking{border-color:var(--acc2);background:var(--accSoft)}
.cell.bad::after{content:"";position:absolute;left:6px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--shu)}
body.noro .cell .r{visibility:hidden}
body.noother .cell .o{display:none}
.sec{font:700 15px/1 var(--serif);letter-spacing:2px;margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font:600 11.5px/1 var(--sans);letter-spacing:.3px;color:var(--ink3)}
/* 抽查 */
.drill{text-align:center;padding:18px 14px}
.drill .big{font:700 84px/1.1 var(--serif);color:var(--ink);margin:6px 0 2px;min-height:92px}
.drill .ans{font:700 22px/1.3 var(--sans);color:var(--shu);letter-spacing:2px;min-height:30px}
.drill .ans small{display:block;font:600 12px/1.5 var(--sans);color:var(--ink3);letter-spacing:.5px}
.drill .st{font-size:12px;color:var(--ink2);margin-bottom:6px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;flex:1;border:0;border-radius:14px;padding:13px 8px;font:700 14px/1 var(--sans);transition:transform .16s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.shu{color:#fff;background:linear-gradient(180deg,var(--accBg2),var(--accBg));box-shadow:0 8px 20px rgba(31,58,96,.28)}
.btn.lite{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--matchaSoft);color:var(--matcha);border:1px solid rgba(79,125,63,.3)}
.btn.no{background:var(--beniSoft);color:var(--beni);border:1px solid rgba(191,47,47,.28)}
.note{font-size:12px;color:var(--ink2);line-height:1.7;margin-top:12px;padding:11px 13px;border-radius:14px;background:rgba(176,138,62,.1);border:1px solid rgba(176,138,62,.25)}
.note b{color:var(--shu)}
.hide{display:none!important}
@media (min-width:640px){.cell .k{font-size:30px}.cell{min-height:72px}}
@media (prefers-color-scheme:dark){.seg{background:rgba(22,29,44,.95)}.tg.on{background:#e9e1d2;color:#141a26}}
</style>
</head>
<body>
<header class="banner" data-fuji="banner">
  <div class="in">
    <a class="home" href="index.html" aria-label="回入口" data-ic="torii"></a>
    <div><h1>五十音図</h1><div class="sub">ごじゅうおんず · 点一下读一下 · 抽查认读</div></div>
  </div>
</header>
<div class="top"><div class="seg" id="seg">
  <button data-t="sei" class="on">清音</button><button data-t="daku">浊音·半浊</button><button data-t="you">拗音</button><button data-t="drill">抽查</button>
</div></div>

<div class="page">
  <div class="bar">
    <button class="tg on" id="hira">ひらがな</button>
    <button class="tg" id="kata">カタカナ</button>
    <button class="tg soft on" id="tgRo">罗马音</button>
    <button class="tg soft on" id="tgOther">对照</button>
  </div>

  <div id="tables">
    <div class="card"><div class="head c5" id="hd"></div><div class="grid" id="grid"></div></div>
    <div class="note" id="tip"></div>
  </div>

  <div id="drillBox" class="hide">
    <div class="bar">
      <button class="tg soft on" data-p="sei">清音</button>
      <button class="tg soft" data-p="daku">浊音</button>
      <button class="tg soft" data-p="you">拗音</button>
      <button class="tg soft" data-p="bad">只抽错的</button>
    </div>
    <div class="card drill">
      <div class="st" id="dst">—</div>
      <div class="big" id="dbig">あ</div>
      <div class="ans" id="dans"></div>
      <div class="row"><button class="btn lite" id="dshow" data-ic="eye">看读音 · 听一下</button></div>
      <div class="row"><button class="btn ok" id="dok" data-ic="check">认得</button><button class="btn no" id="dno" data-ic="cross">不认得</button></div>
    </div>
    <div class="note">看到假名 → <b>先自己念出来</b> → 再点「看读音」核对。不认得的会记下来（表里带红点），点「只抽错的」专门刷。</div>
  </div>
</div>

<script src="fuji.js?v=1"></script>
<script src="%E9%9F%B3%E9%A2%91%E7%B4%A2%E5%BC%95.js?v=0923k"></script>
<script src="ambient_data.js?v=1"></script>
<script src="ambient.js?v=1"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var AUD = window.JP_AUDIO || {};
  var SEI = [['あ','い','う','え','お'],['か','き','く','け','こ'],['さ','し','す','せ','そ'],['た','ち','つ','て','と'],['な','に','ぬ','ね','の'],
             ['は','ひ','ふ','へ','ほ'],['ま','み','む','め','も'],['や','','ゆ','','よ'],['ら','り','る','れ','ろ'],['わ','','','','を'],['ん','','','','']];
  var DAKU = [['が','ぎ','ぐ','げ','ご'],['ざ','じ','ず','ぜ','ぞ'],['だ','ぢ','づ','で','ど'],['ば','び','ぶ','べ','ぼ'],['ぱ','ぴ','ぷ','ぺ','ぽ']];
  var YOU = ['き','し','ち','に','ひ','み','り','ぎ','じ','び','ぴ'].map(function (h) { return [h + 'ゃ', h + 'ゅ', h + 'ょ']; });
  var RO = { 'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko','さ':'sa','し':'shi','す':'su','せ':'se','そ':'so',
    'た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to','な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no','は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho',
    'ま':'ma','み':'mi','む':'mu','め':'me','も':'mo','や':'ya','ゆ':'yu','よ':'yo','ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro','わ':'wa','を':'o','ん':'n',
    'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo','だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do',
    'ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo','ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po' };
  var YRO = { 'き':'ky','し':'sh','ち':'ch','に':'ny','ひ':'hy','み':'my','り':'ry','ぎ':'gy','じ':'j','び':'by','ぴ':'py' };
  function ro(h) {
    if (h.length === 2) { var b = YRO[h[0]], v = { 'ゃ':'a','ゅ':'u','ょ':'o' }[h[1]]; return b + v; }
    return RO[h] || '';
  }
  function toKata(s) { return s.replace(/[ぁ-ゖ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) + 0x60); }); }
  var TIPS = {
    sei: '<b>ん</b> 单独一行；<b>を</b> 读 o，只当助词用；<b>は</b> 当助词读 wa、<b>へ</b> 当助词读 e。片假名最易混：<b>シ／ツ</b>（点横着＝シ，点竖着＝ツ）、<b>ソ／ン</b>。',
    daku: '<b>゛</b>两点＝浊音（喉咙振）；<b>゜</b>圈＝半浊音，只有 ぱ 行。<b>じ＝ぢ</b>、<b>ず＝づ</b> 读音一样，平时写 じ／ず。',
    you: '拗音＝い段字 ＋ 小写 <b>ゃゅょ</b>，合成<b>一拍</b>：きゃ 是 kya 一个音，不是 き＋や 两个音。写的时候 ゃ 要写小。'
  };

  var st = { t: 'sei', kata: false, ro: true, other: true };
  var bad = [];
  try { bad = JSON.parse(localStorage.getItem('jp_kana_bad') || '[]') || []; } catch (e) {}
  function saveBad() { try { localStorage.setItem('jp_kana_bad', JSON.stringify(bad)); } catch (e) {} }

  /* ---------- 发音 ---------- */
  var actx = null, cache = {};
  function ac() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} return actx; }
  function play(url, text) {
    var c = ac(); if (!c) return;
    function go(b) { var s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); }
    if (cache[url]) { go(cache[url]); return; }
    fetch(url).then(function (r) { return r.arrayBuffer(); }).then(function (ab) { return new Promise(function (res, rej) { c.decodeAudioData(ab, res, rej); }); })
      .then(function (b) { cache[url] = b; go(b); }).catch(function () { tts(text); });
  }
  function tts(t) { try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; u.rate = 0.8; speechSynthesis.speak(u); } catch (e) {} }
  function say(h) {
    var e = AUD[h];
    if (e && (e[1] || e[0])) { play(e[1] || e[0], h); return; }      // 单个假名：神经音比真人音更干净
    tts(h);
  }

  /* ---------- 表 ---------- */
  function cellHTML(h) {
    if (!h) return '<div class="cell empty"></div>';
    var main = st.kata ? toKata(h) : h, other = st.kata ? h : toKata(h);
    return '<button class="cell' + (bad.indexOf(h) >= 0 ? ' bad' : '') + '" data-h="' + h + '"><span class="o">' + other + '</span>' +
      '<div class="k">' + main + '</div><div class="r">' + ro(h) + '</div></button>';
  }
  function render() {
    var rows = st.t === 'daku' ? DAKU : st.t === 'you' ? YOU : SEI;
    var cols = st.t === 'you' ? 3 : 5;
    $('hd').className = 'head c' + cols;
    $('hd').innerHTML = (cols === 5 ? ['a', 'i', 'u', 'e', 'o'] : ['ya', 'yu', 'yo']).map(function (x) { return '<div>' + x + '</div>'; }).join('');
    $('grid').className = 'grid c' + cols;
    $('grid').innerHTML = rows.map(function (r) { return r.map(cellHTML).join(''); }).join('');
    $('tip').innerHTML = TIPS[st.t] || '';
    $('grid').querySelectorAll('.cell[data-h]').forEach(function (b) {
      b.onclick = function () {
        say(b.getAttribute('data-h'));
        b.classList.add('speaking'); setTimeout(function () { b.classList.remove('speaking'); }, 700);
      };
    });
  }

  /* ---------- 抽查 ---------- */
  var dr = { pool: 'sei', cur: null, shown: false, ok: 0, no: 0 };
  function poolList() {
    var flat = function (a) { return a.reduce(function (x, r) { return x.concat(r.filter(Boolean)); }, []); };
    if (dr.pool === 'daku') return flat(DAKU);
    if (dr.pool === 'you') return flat(YOU);
    if (dr.pool === 'bad') return bad.slice();
    return flat(SEI);
  }
  function next() {
    var l = poolList();
    if (!l.length) { $('dbig').textContent = '全清'; $('dans').innerHTML = '<small>错题本是空的 —— 先抽几轮</small>'; dr.cur = null; stat(); return; }
    var h; do { h = l[Math.floor(Math.random() * l.length)]; } while (l.length > 1 && h === dr.cur);
    dr.cur = h; dr.shown = false;
    $('dbig').textContent = st.kata ? toKata(h) : h;
    $('dans').innerHTML = '';
    stat();
  }
  function stat() { $('dst').textContent = '认得 ' + dr.ok + '　不认得 ' + dr.no + '　·　错题本 ' + bad.length + ' 个'; }
  function reveal() {
    if (!dr.cur) return;
    dr.shown = true;
    $('dans').innerHTML = ro(dr.cur) + '<small>' + (st.kata ? dr.cur : toKata(dr.cur)) + '</small>';
    say(dr.cur);
  }
  $('dshow').onclick = reveal;
  $('dbig').onclick = reveal;
  $('dok').onclick = function () {
    if (!dr.cur) return;
    dr.ok++; var i = bad.indexOf(dr.cur); if (i >= 0 && dr.shown) { bad.splice(i, 1); saveBad(); }
    next();
  };
  $('dno').onclick = function () {
    if (!dr.cur) return;
    dr.no++; if (bad.indexOf(dr.cur) < 0) { bad.push(dr.cur); saveBad(); }
    if (!dr.shown) { reveal(); setTimeout(next, 1400); } else next();
  };
  document.querySelectorAll('[data-p]').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('[data-p]').forEach(function (x) { x.classList.toggle('on', x === b); });
      dr.pool = b.getAttribute('data-p'); next();
    };
  });

  /* ---------- 切换 ---------- */
  document.querySelectorAll('#seg button').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('#seg button').forEach(function (x) { x.classList.toggle('on', x === b); });
      st.t = b.getAttribute('data-t');
      var drill = st.t === 'drill';
      $('tables').classList.toggle('hide', drill); $('drillBox').classList.toggle('hide', !drill);
      if (drill) next(); else render();
    };
  });
  $('hira').onclick = function () { st.kata = false; this.classList.add('on'); $('kata').classList.remove('on'); render(); if (dr.cur) { $('dbig').textContent = dr.cur; if (dr.shown) reveal(); } };
  $('kata').onclick = function () { st.kata = true; this.classList.add('on'); $('hira').classList.remove('on'); render(); if (dr.cur) { $('dbig').textContent = toKata(dr.cur); if (dr.shown) reveal(); } };
  $('tgRo').onclick = function () { st.ro = !st.ro; this.classList.toggle('on', st.ro); document.body.classList.toggle('noro', !st.ro); };
  $('tgOther').onclick = function () { st.other = !st.other; this.classList.toggle('on', st.other); document.body.classList.toggle('noother', !st.other); };

  render();
})();
</script>
</body>
</html>
