<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f6f0e4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1522" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日本語">
<title>日本語 · 今天默什么</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0 0 calc(120px + env(safe-area-inset-bottom));font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* ---------- 富士 Hero ---------- */
.hero{height:380px;color:#fff}
.hero::after{content:"";position:absolute;inset:0 0 auto;height:150px;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(10,14,30,.28),rgba(10,14,30,0))}
.hero-in{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 18px 0}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.seal{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;flex:0 0 auto;
  font:700 18px/1 var(--serif);color:#fff;background:var(--shu);transform:rotate(-4deg);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.28),0 4px 12px rgba(0,0,0,.18)}
.brand b{display:block;font:700 19px/1.1 var(--serif);letter-spacing:3px;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.brand small{display:block;font-size:11px;opacity:.85;letter-spacing:1px;margin-top:3px}
.date{text-align:right;text-shadow:0 1px 8px rgba(0,0,0,.3)}
.date b{display:block;font:700 15px/1.1 var(--serif);letter-spacing:2px}
.date span{font-size:11.5px;opacity:.9;font-variant-numeric:tabular-nums}
.greet{margin-top:18px;text-shadow:0 2px 12px rgba(0,0,0,.3)}
.greet .jp{font:700 26px/1.2 var(--serif);letter-spacing:2px}
.greet .zh{font-size:12.5px;opacity:.92;margin-top:4px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;padding:5px 10px;border-radius:999px;
  color:#fff;background:rgba(14,18,34,.32);border:1px solid rgba(255,255,255,.28)}
.pill b{font-variant-numeric:tabular-nums}

/* ---------- 通用卡片 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 11px}
.sec h2{margin:0;font:700 16px/1 var(--serif);letter-spacing:2px;color:var(--ink)}
.sec h2 small{font:600 11.5px/1 var(--sans);letter-spacing:.5px;color:var(--ink3);margin-left:8px}
.sec .lk{border:0;background:none;color:var(--acc);font-weight:650;font-size:12.5px;padding:4px 2px 4px 10px}

/* ---------- 提示 ---------- */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;max-width:86vw;padding:10px 16px;border-radius:12px;
  background:var(--ink);color:var(--paper);font-size:13px;box-shadow:0 10px 26px rgba(0,0,0,.2);pointer-events:none;transition:opacity .25s}
.toast[hidden]{display:block!important;opacity:0}
/* ---------- 查词 ---------- */
.search{position:relative;z-index:3;margin-top:-26px;background:var(--solid);padding:4px 6px 4px 14px;display:flex;align-items:center;gap:8px}
.search input{flex:1;border:0;background:none;outline:0;font:16px/1.4 var(--sans);color:var(--ink);padding:11px 0;min-width:0}
.search input::placeholder{color:var(--ink3)}
.search .sic{display:grid;color:var(--ink3);font-size:17px}
.search .sic>svg.ic{margin:0}
.search .x{border:0;background:none;color:var(--ink3);font-size:15px;padding:8px 10px;display:none}
.res{margin-top:8px;display:none}
.res.show{display:block}
.hit{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.hit:last-child{border-bottom:0}
.hit .k{font:700 19px/1.25 var(--serif);color:var(--ink)}
.hit .j{font-size:12px;color:var(--ink2);margin-left:6px;font-weight:500}
.hit .c{font-size:12.5px;color:var(--shu);margin-top:2px}
.hit .t{font-size:11.5px;color:var(--ink3);margin-top:3px;display:none;line-height:1.5}
.hit.open .t{display:block}
.hit .body{flex:1;min-width:0}
.hit .from{font-size:10.5px;color:var(--ink3);white-space:nowrap}
.hit .spk{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--ai);font-size:14px;flex:0 0 auto}
.none{padding:14px;font-size:12.5px;color:var(--ink3);text-align:center}

/* ---------- 范围卡 ---------- */
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.bento{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;text-align:left;padding:13px 13px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);
  box-shadow:0 6px 18px rgba(80,52,22,.07);transition:transform .22s var(--ease),border-color .25s,box-shadow .25s;overflow:hidden}
.tile:active{transform:scale(.965)}
.tile .seal{width:30px;height:30px;font-size:15px;border-radius:7px;transform:rotate(-3deg);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3)}
.tile .nm{font:700 14.5px/1.3 var(--serif);color:var(--ink);margin-top:10px;letter-spacing:.5px}
.tile .ct{font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.6}
.tile .ring{position:absolute;right:10px;top:10px;width:38px;height:38px}
.tile .ring svg{transform:rotate(-90deg);display:block}
.tile .ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:9.5px;font-weight:750;color:var(--ink2);font-variant-numeric:tabular-nums}
.bd{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:4px;line-height:1.6}
.bd.err{color:var(--beni);background:var(--beniSoft)}
.bd.last{color:var(--kin);background:rgba(176,138,62,.14)}
.bd.bdue{color:#fff;background:var(--beni)}
.bd.new{color:#fff;background:var(--matcha)}
.tile.on{border-color:var(--shu);box-shadow:0 0 0 1.5px var(--shu) inset,0 10px 26px rgba(207,63,40,.16)}
.tile .stamp{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;display:none;place-items:center;
  font:700 15px/1 var(--serif);color:var(--shu);border:2px solid var(--shu);transform:rotate(-14deg);opacity:.9}
.tile.on .stamp{display:grid;animation:stamp .32s var(--ease)}
@keyframes stamp{0%{transform:rotate(-14deg) scale(1.6)}100%{transform:rotate(-14deg) scale(1)}}
.bento.need{animation:shake .34s ease-in-out 2}
@keyframes shake{0%,100%{transform:none}25%{transform:translate3d(-5px,0,0)}75%{transform:translate3d(5px,0,0)}}

/* ---------- 复习计划 ---------- */
.plan{padding:4px 0}
.prow{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .seal{width:28px;height:28px;font-size:14px;border-radius:7px}
.prow .pb{flex:1;min-width:0}
.prow .pn{font:700 14px/1.3 var(--serif);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .ps{font-size:11.5px;color:var(--ink3);margin-top:2px}
.prow .ps b{font-weight:700}
.prow .ps b.p-late{color:var(--shu)}.prow .ps b.p-today{color:var(--kin)}.prow .ps b.p-ok{color:var(--matcha)}
.dots{display:flex;gap:3px;margin-top:5px}
.dots i{width:14px;height:3px;border-radius:2px;background:var(--line)}
.dots i.f{background:var(--matcha)}
.prow button{border:1px solid var(--line);background:var(--card2);color:var(--ink2);font:650 11.5px/1 var(--sans);padding:8px 10px;border-radius:10px;white-space:nowrap}
.prow button.mk{background:var(--matchaSoft);color:var(--matcha);border-color:transparent}
.plan-note{font-size:11.5px;color:var(--ink3);padding:10px 14px 12px;line-height:1.6;border-top:1px dashed var(--line)}

/* ---------- 工具 ---------- */
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.tools{grid-template-columns:repeat(4,1fr)}}
.tool{display:flex;align-items:center;gap:10px;padding:13px;border-radius:14px;text-decoration:none;color:var(--ink);
  background:var(--card);border:1px solid var(--line);transition:transform .2s var(--ease)}
.tool:active{transform:scale(.97)}
.tool .ic{font:700 20px/1 var(--serif);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--aiSoft);color:var(--ai)}
.tool b{display:block;font:700 13.5px/1.3 var(--serif)}
.tool small{display:block;font-size:11px;color:var(--ink3)}
.foot{text-align:center;font-size:11px;color:var(--ink3);line-height:1.9;margin:26px 0 8px}
.foot .kana{font:600 13px/1.6 var(--serif);letter-spacing:4px;color:var(--ink2)}

/* ---------- Dock ---------- */
.dockwrap{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(0,0,0,0),var(--paper) 42%)}
.dock{max-width:760px;margin:0 auto;display:flex;gap:7px;align-items:center;border-radius:20px;padding:7px;
  background:var(--card);border:1px solid var(--line);box-shadow:0 14px 36px rgba(80,52,22,.18)}
.dock .mini{flex:1;border:0;border-radius:14px;padding:9px 2px 8px;color:var(--ink2);background:none;font:650 11px/1.2 var(--sans)}
.dock .mini b{display:block;font:700 17px/1.2 var(--serif);color:var(--ink);margin-bottom:2px}
.dock .mini:active{background:var(--aiSoft)}
.dock .go{flex:1.7;border:0;border-radius:15px;padding:14px 6px;color:#fff;font:750 14px/1 var(--sans);white-space:nowrap;
  background:linear-gradient(180deg,var(--accBg2),var(--accBg));box-shadow:0 10px 22px rgba(31,58,96,.28);transition:transform .18s var(--ease)}
.dock .go:active{transform:scale(.97)}
#ambWrap{bottom:calc(100px + env(safe-area-inset-bottom))!important}

@media (min-width:700px){.hero{height:420px}.greet .jp{font-size:32px}}
@media (prefers-color-scheme:dark){
  .dockwrap{background:linear-gradient(180deg,rgba(0,0,0,0),var(--paper) 42%)}
  .num i{color:#fff}
}
</style>
</head>
<body>

<header class="hero" data-fuji="hero">
  <div class="hero-in">
    <div class="hd">
      <div class="brand"><span class="seal">日</span><div><b>日本語</b><small>にほんご · 每日一默</small></div></div>
      <div class="date"><b id="wmonth">—</b><span id="day">—</span></div>
    </div>
    <div class="greet"><div class="jp" id="gJp">こんにちは</div><div class="zh" id="gZh">—</div></div>
    <div class="pills">
      <span class="pill" data-ic="flame">连续 <b id="streak">1</b> 天</span>
      <span class="pill">掌握 <b id="mastery">—</b></span>
      <span class="pill">错词 <b id="wrongN">0</b></span>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="card search">
    <span class="sic" data-ic="search" aria-hidden="true"></span>
    <input id="q" type="search" placeholder="查词：假名 / 汉字 / 中文" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="x" id="qx" aria-label="清空" data-ic="close"></button>
  </div>
  <div class="card res" id="res"></div>

  <div class="sec"><h2>選ぶ<small id="selInfo">选范围 · 可多选</small></h2><span><button class="lk" id="allBtn">全选</button><button class="lk" id="clrBtn">清空</button></span></div>
  <div class="bento" id="tiles"></div>

  <div class="sec"><h2>復習<small>复习计划</small></h2><span style="font-size:11px;color:var(--ink3)">间隔 1·2·4·7·15·30 天</span></div>
  <div class="card plan" id="plan"></div>

  <div class="sec"><h2>道具<small>工具</small></h2></div>
  <div class="tools">
    <a class="tool" href="kana.html"><span class="ic">あ</span><span><b>五十音図</b><small>点读 · 认读抽查</small></span></a>
    <a class="tool" href="%E8%AF%AD%E9%9F%B3%E5%AF%B9%E6%AF%94.html"><span class="ic">音</span><span><b>发音对比</b><small>真人／神经／系统</small></span></a>
    <a class="tool" href="%E5%90%AC%E8%AF%BB%E9%BB%98%E5%86%99%E7%BA%B8.html"><span class="ic">紙</span><span><b>听读默写纸</b><small>含答案页 · 可打印</small></span></a>
    <a class="tool" href="%E5%90%AC%E5%86%99%E7%BA%B8.html"><span class="ic">書</span><span><b>听写纸</b><small>顺序／乱序</small></span></a>
  </div>

  <div class="foot"><div class="kana">いちにち　ひとつずつ</div>一天一点 · 真人音 Forvo · 神经音 Nanami · 全部离线可用</div>
</div>

<div class="toast" id="toast" hidden role="status"></div>
<div class="dockwrap">
  <div class="dock">
    <button class="mini" data-mode="read"><b>読</b>点读</button>
    <button class="mini" data-mode="card"><b>試</b>自测</button>
    <button class="go" data-mode="dict">开始默写</button>
    <button class="mini" data-mode="daku"><b>濁</b>浊音</button>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var TOOL = '%E6%97%A5%E8%AF%AD.html';
  var APP = window.JP_AUDIO || {};
  var SRS = window.JPSRS;
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  /* ---------------- 日期 / 问候 ---------------- */
  var d = new Date();
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  $('day').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日（' + '日月火水木金土'[d.getDay()] + '）';
  $('wmonth').textContent = window.JPFuji ? JPFuji.monthName() : '';
  var ph = window.JPFuji ? JPFuji.phase() : 'day', se = window.JPFuji ? JPFuji.season() : '';
  var G = { dawn: ['おはよう', '早上好 · 趁脑子最清醒，默一组'], day: ['こんにちは', '你好 · 今天也默一点吧'],
            dusk: ['こんばんは', '傍晚好 · 晚饭前默完最轻松'], night: ['おつかれさま', '辛苦了 · 睡前过一遍，记得最牢'] };
  var SE = { spring: '桜の季節', summer: '夏の盛り', autumn: '紅葉の季節', winter: '雪の季節' };
  $('gJp').textContent = G[ph][0];
  $('gZh').textContent = G[ph][1] + (SE[se] ? '　' + SE[se] : '');

  /* ---------------- 范围 ---------------- */
  var COLORS = ['#cf3f28', '#1f3b63', '#4f7d3f', '#b08a3e', '#6b4c8a', '#c4607a', '#2f8f9d', '#3a3530'];
  var NUM = '〇一二三四五六七八九十';
  function clean(label) { return label.replace(/^[^一-龥A-Za-z0-9]*/, '').replace(/\s*\d+\s*词$/, ''); }
  function markOf(x, fallback) {
    if (x.mark) return x.mark;
    var m = /第\s*(\d+)\s*课/.exec(x.label || '');
    if (m && +m[1] <= 10) return NUM[+m[1]];
    return fallback;
  }
  var SETS = [];
  (window.PIC_SETS || []).forEach(function (s, i) {
    SETS.push({ id: s.id, mark: markOf(s, i ? '絵' : '図'), color: COLORS[(4 + i) % 8], nm: clean(s.label) || s.id, words: s.words, date: s.date });
  });
  (window.EXTRA_SETS || []).forEach(function (x, i) {
    var side = /左/.test(x.label) ? '左' : /右/.test(x.label) ? '右' : '';
    SETS.push({ id: x.id, mark: markOf(x, '課'), sub: side, color: COLORS[(i + 1) % 8], nm: clean(x.label) || x.id, words: x.words, date: x.date });
  });
  SETS.push({ id: 'w2',    mark: '二', color: '#4f7d3f', nm: '生词表 2', words: WORDS2 });
  SETS.push({ id: 'right', mark: '右', color: '#2f8f9d', nm: '生词表1 · 右栏', words: WORDS });
  SETS.push({ id: 'left',  mark: '左', color: '#1f3b63', nm: '生词表1 · 左栏', words: LEFT_WORDS });
  SETS.push({ id: 'all',   mark: '全', color: '#b08a3e', nm: '生词表1 · 全表', words: WORDS.concat(LEFT_WORDS), combo: ['right', 'left'] });
  SETS.push({ id: 'daku',  mark: '濁', color: '#6b4c8a', nm: '浊音 · 半浊音', unit: '音',
              words: (window.DAKU || []).map(function (x) { return { k: x.k }; }), mode: 'daku' });
  SETS.push({ id: 'sent',  mark: '文', color: '#c4607a', nm: '例句 · 语法', unit: '句',
              words: (window.SENTENCES || []).map(function (x) { return { k: x.ja }; }), mode: 'read', solo: true });
  SETS.push({ id: 'wrong', mark: '誤', color: '#3a3530', nm: '错词本', words: [], mode: 'dict', solo: true, isWrong: true });

  function setOf(id) { for (var i = 0; i < SETS.length; i++) if (SETS[i].id === id) return SETS[i]; return null; }
  function wordsOf(id) { var s = setOf(id); return s ? s.words : []; }
  var REAL = SETS.filter(function (s) { return !s.combo && !s.isWrong; }).map(function (s) { return s.id; });
  if (SRS) SRS.ensure(REAL);

  var wrong = [], dakuWrong = [], sel = [];
  try { wrong = JSON.parse(localStorage.getItem('jp_wrong_k') || '[]') || []; } catch (e) {}
  try { dakuWrong = JSON.parse(localStorage.getItem('jp_daku_k') || '[]') || []; } catch (e) {}
  try { sel = JSON.parse(localStorage.getItem('jp_sel') || '[]') || []; } catch (e) {}

  /* 错词本的实际词（按假名去重，跨所有范围） */
  var ALLW = [], seenAll = {};
  SETS.forEach(function (s) { if (s.id === 'daku' || s.id === 'sent') return; s.words.forEach(function (w) { if (w.c && !seenAll[w.k]) { seenAll[w.k] = 1; ALLW.push(w); } }); });
  setOf('wrong').words = ALLW.filter(function (w) { return wrong.indexOf(w.k) >= 0; });

  /* ---------------- 连续天数 ---------------- */
  (function streak() {
    var days = [];
    try { days = JSON.parse(localStorage.getItem('jp_days') || '[]') || []; } catch (e) {}
    var ymd = function (t) { return t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate()); };
    var today = ymd(d);
    if (days.indexOf(today) < 0) { days.push(today); if (days.length > 120) days = days.slice(-120); }
    try { localStorage.setItem('jp_days', JSON.stringify(days)); } catch (e) {}
    var n = 1, t = new Date(d.getTime());
    for (var k = 1; k < 120; k++) { t.setDate(t.getDate() - 1); if (days.indexOf(ymd(t)) >= 0) n++; else break; }
    $('streak').textContent = n;
  })();

  function isNew(s) {
    if (!s.date) return false;
    var p = String(s.date).split('-'); if (p.length < 3) return false;
    return (d - new Date(+p[0], +p[1] - 1, +p[2])) / 86400000 < 4;
  }
  function last(scope) {
    try { var o = JSON.parse(localStorage.getItem('jp_last_' + scope) || 'null'); return o && o.tot ? o : null; } catch (e) { return null; }
  }

  /* ---------------- 卡片 ---------------- */
  function renderTiles() {
    var box = $('tiles'); box.innerHTML = '';
    SETS.forEach(function (s) {
      var el = document.createElement('button');
      el.className = 'tile'; el.setAttribute('data-id', s.id);
      var book = (s.id === 'daku' ? dakuWrong : wrong);
      var total = s.words.length;
      var errs = s.isWrong ? total : s.words.filter(function (w) { return book.indexOf(w.k) >= 0; }).length;
      var good = s.isWrong ? (total ? 0 : 1) : (total ? (total - errs) / total : 0);
      var R = 15, C = 2 * Math.PI * R, off = C * (1 - good);
      var st = SRS && !s.combo && !s.isWrong ? SRS.status(s.id) : null;
      var lg = last(s.id);
      var ct = s.isWrong ? (total ? total + ' 个待重默' : '空的 · 干净') : total + ' ' + (s.unit || '词');
      el.innerHTML =
        '<span class="seal" style="background:' + s.color + '">' + esc(s.mark) + '</span>' +
        '<div class="nm">' + esc(s.nm) + (s.solo && !s.isWrong ? ' <small style="font:500 10.5px var(--sans);color:var(--ink3)">单练</small>' : '') + '</div>' +
        '<div class="ct">' + ct +
          (isNew(s) ? ' <span class="bd new">NEW</span>' : '') +
          (st && st.days <= 0 && !st.doneToday ? ' <span class="bd bdue">' + (st.days < 0 ? '逾期' : '今天默') + '</span>' : '') +
          (!s.isWrong && errs ? ' <span class="bd err">错 ' + errs + '</span>' : '') +
          (lg ? ' <span class="bd last">上次 ' + lg.ok + '/' + lg.tot + '</span>' : '') + '</div>' +
        (s.isWrong ? '' :
        '<div class="ring"><svg width="38" height="38">' +
          '<circle cx="19" cy="19" r="' + R + '" fill="none" stroke="var(--line)" stroke-width="3"/>' +
          '<circle cx="19" cy="19" r="' + R + '" fill="none" stroke="' + s.color + '" stroke-width="3" stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/>' +
        '</svg><span>' + Math.round(good * 100) + '%</span></div>') +
        '<span class="stamp">選</span>';
      el.onclick = function () {
        if (s.isWrong) { if (!total) { flash('错词本是空的，默写时判「错」的词会自动进来'); return; } location.href = TOOL + '?mode=dict&set=wrong'; return; }
        if (s.solo) { location.href = TOOL + '?mode=' + (s.mode || 'read') + '&set=' + s.id; return; }
        toggle(s.id);
      };
      box.appendChild(el);
    });
  }
  var toastT = null;
  function flash(msg) { var el = $('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { el.hidden = true; }, 2400); }

  function toggle(id) { var i = sel.indexOf(id); if (i >= 0) sel.splice(i, 1); else sel.push(id); save(); paint(); }
  function cleanSel() { sel = sel.filter(function (id) { var t = setOf(id); return t && !t.solo; }); }
  function save() { cleanSel(); try { localStorage.setItem('jp_sel', JSON.stringify(sel)); } catch (e) {} }
  function selWords() {
    var out = [], seen = {};
    sel.forEach(function (id) { wordsOf(id).forEach(function (w) { if (w && w.k && !seen[w.k]) { seen[w.k] = 1; out.push(w); } }); });
    return out;
  }

  /* ---------------- 今天到期（来自 srs.js，本机实时算） ---------------- */
  function dueList() {
    if (!SRS) return [];
    return REAL.map(function (id) { return SRS.status(id); })
      .filter(function (x) { return x && x.days <= 0 && !x.doneToday; })
      .sort(function (a, b) { return ((a.days === 0) ? -999 : a.days) - ((b.days === 0) ? -999 : b.days); });
  }
  /* ---------------- 复习计划 ---------------- */
  function renderPlan() {
    var box = $('plan'); if (!SRS) { box.style.display = 'none'; return; }
    var rows = REAL.map(function (id) { return SRS.status(id); }).filter(Boolean)
      .sort(function (a, b) { return (a.doneToday - b.doneToday) || (a.days - b.days); });
    var h = '';
    rows.forEach(function (x) {
      var s = setOf(x.id); if (!s) return;
      var when = x.doneToday ? '<b class="p-ok">今天已复习</b> · 下次 ' + SRS.fmt(x.due) + '（' + x.days + '天后）'
        : x.days < 0 ? '<b class="p-late">逾期 ' + (-x.days) + ' 天</b> · 本该 ' + SRS.fmt(x.due)
        : x.days === 0 ? '<b class="p-today">今天到期</b>'
        : SRS.fmt(x.due) + ' · ' + x.days + ' 天后';
      var dots = '';
      for (var i = 0; i < SRS.GAP.length; i++) dots += '<i' + (i < x.stage ? ' class="f"' : '') + '></i>';
      h += '<div class="prow"><span class="seal" style="background:' + s.color + '">' + esc(s.mark) + '</span>' +
        '<div class="pb"><div class="pn">' + esc(s.nm) + '</div><div class="ps">第 ' + (x.doneToday ? x.n : x.n + 1) + ' 次 · ' + when + '</div><div class="dots">' + dots + '</div></div>' +
        (x.doneToday ? '<button data-u="' + x.id + '">' + JPI('undo') + '撤销</button>'
                     : (x.days <= 0 ? '<button class="mk" data-d="' + x.id + '">' + JPI('check') + '默完了</button>' : '<button data-d="' + x.id + '">提前复习</button>')) +
        '</div>';
    });
    h += '<div class="plan-note">在工具页默完一轮会<b>自动打勾</b>；纸上默的就点「默完了」。同一天多默几遍只算一次。</div>';
    box.innerHTML = h;
    box.querySelectorAll('[data-d]').forEach(function (b) { b.onclick = function () { SRS.done([b.getAttribute('data-d')]); refresh(); }; });
    box.querySelectorAll('[data-u]').forEach(function (b) { b.onclick = function () { SRS.undo(b.getAttribute('data-u')); refresh(); }; });
  }

  /* ---------------- 绘制 ---------------- */
  function paint() {
    document.querySelectorAll('.tile').forEach(function (t) { t.classList.toggle('on', sel.indexOf(t.getAttribute('data-id')) >= 0); });
    var n = selWords().length;
    var tot = 0, bad = 0, seen = {};
    SETS.forEach(function (s) {
      if (s.solo) return;
      var book = s.id === 'daku' ? dakuWrong : wrong;
      s.words.forEach(function (w) { if (seen[w.k]) return; seen[w.k] = 1; tot++; if (book.indexOf(w.k) >= 0) bad++; });
    });
    $('mastery').textContent = Math.round((1 - bad / (tot || 1)) * 100) + '%';
    $('wrongN').textContent = wrong.length + dakuWrong.length;
    $('selInfo').textContent = n ? '已选 ' + sel.length + ' 组 · ' + n + ' 词' : '点卡片选范围，可多选';
    var go = document.querySelector('.dock .go');
    go.textContent = n ? '默写 · ' + n + ' 词' : '开始默写';
  }
  function refresh() { renderTiles(); renderPlan(); paint(); }

  /* 第一次打开 / 没有选择 → 选今天到期的；今天没有就选逾期最久的那一组（一次别贪多） */
  if (!sel.length) {
    var dl = dueList().filter(function (x) { var s = setOf(x.id); return s && !s.solo; });
    var td = dl.filter(function (x) { return x.days === 0; });
    (td.length ? td : dl.slice(0, 1)).forEach(function (x) { sel.push(x.id); });
    save();
  }
  cleanSel();

  $('allBtn').onclick = function () { sel = SETS.filter(function (s) { return !s.solo && !s.combo; }).map(function (s) { return s.id; }); save(); paint(); };
  $('clrBtn').onclick = function () { sel = []; save(); paint(); };

  /* ---------------- 发音 ---------------- */
  var actx = null, bufCache = {};
  function ac() {
    try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {}
    return actx;
  }
  function playUrl(url) {
    var c = ac(); if (!c) return;
    function go(b) { var s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); }
    if (bufCache[url]) { go(bufCache[url]); return; }
    fetch(url).then(function (r) { return r.arrayBuffer(); })
      .then(function (ab) { return new Promise(function (res, rej) { c.decodeAudioData(ab, res, rej); }); })
      .then(function (b) { bufCache[url] = b; go(b); }).catch(function () {});
  }
  function say(text) {
    var e = APP[text];
    if (e && (e[0] || e[1])) { playUrl(e[0] || e[1]); return; }
    if (window.speechSynthesis) { try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP'; u.rate = 0.85; speechSynthesis.speak(u); } catch (err) {} }
  }

  /* ---------------- 查词 ---------------- */
  var INDEX = [], idx = {};
  function addIdx(list, from) {
    (list || []).forEach(function (w) {
      if (!w || !w.k) return;
      if (idx[w.k]) { if (idx[w.k].from.indexOf(from) < 0) idx[w.k].from.push(from); return; }
      idx[w.k] = { w: w, from: [from] }; INDEX.push(idx[w.k]);
    });
  }
  SETS.forEach(function (s) { if (!s.combo && !s.solo && s.id !== 'daku') addIdx(s.words, s.nm); });
  addIdx(window.YA_WORDS, '～屋');
  function kataToHira(s) { return s.replace(/[ァ-ヶ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0x60); }); }
  function norm(s) { return kataToHira(String(s || '').toLowerCase().replace(/\s+/g, '')); }
  function search(q) {
    var n = norm(q); if (!n) return [];
    var out = [];
    INDEX.forEach(function (it) {
      var w = it.w, sc = 0;
      var k = norm(w.k), j = norm(w.j), c = norm(w.c);
      if (k === n || j === n) sc = 100; else if (k.indexOf(n) === 0) sc = 80; else if (k.indexOf(n) >= 0) sc = 60;
      else if (j && j.indexOf(n) >= 0) sc = 55; else if (c.indexOf(n) >= 0) sc = 50;
      if (sc) out.push({ it: it, sc: sc });
    });
    return out.sort(function (a, b) { return b.sc - a.sc; }).slice(0, 12).map(function (x) { return x.it; });
  }
  function renderRes() {
    var q = $('q').value, box = $('res');
    $('qx').style.display = q ? 'block' : 'none';
    if (!q.trim()) { box.classList.remove('show'); box.innerHTML = ''; return; }
    var hits = search(q);
    box.classList.add('show');
    if (!hits.length) { box.innerHTML = '<div class="none">没找到「' + esc(q) + '」—— 可能还没加进词表</div>'; return; }
    box.innerHTML = hits.map(function (it, i) {
      var w = it.w;
      return '<div class="hit" data-i="' + i + '"><div class="body"><div class="k">' + esc(w.k) + '<span class="j">' + esc(w.j || '') + (w.a ? ' ' + esc(w.a) : '') + '</span></div>' +
        '<div class="c">' + esc(w.c) + '</div>' + (w.t ? '<div class="t">' + esc(w.t) + '</div>' : '') + '</div>' +
        '<span class="from">' + esc(it.from[0]) + '</span><button class="spk" aria-label="发音">' + JPI('speaker') + '</button></div>';
    }).join('');
    box.querySelectorAll('.hit').forEach(function (el) {
      var w = hits[+el.getAttribute('data-i')].w;
      el.onclick = function () { el.classList.toggle('open'); say(w.k); };
    });
  }
  $('q').addEventListener('input', renderRes);
  $('qx').onclick = function () { $('q').value = ''; renderRes(); $('q').focus(); };

  /* ---------------- 跳转 ---------------- */
  function go(mode) {
    if (mode === 'daku') { location.href = TOOL + '?mode=daku'; return; }
    var ids = sel.slice();
    if (!ids.length) {
      flash('先点下面的卡片选一个范围');
      $('tiles').classList.add('need'); setTimeout(function () { $('tiles').classList.remove('need'); }, 900);
      $('tiles').scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    save();
    var one = ids.length === 1 && ids[0] !== 'daku';
    location.href = TOOL + '?mode=' + mode + (one ? '&set=' + ids[0] : '&set=sel&sets=' + ids.join(','));
  }
  document.querySelectorAll('.dock button').forEach(function (b) { b.onclick = function () { go(b.getAttribute('data-mode')); }; });

  refresh();
})();
</script>
</body>
